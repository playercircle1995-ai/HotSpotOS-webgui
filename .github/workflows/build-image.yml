name: Build HotSpotOS image

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "CustomPiOS variant to build (leave as 'default' for the main HotSpotOS build)"
        required: true
        default: "default"

jobs:
  build:
    name: CustomPiOS image build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out HotSpotOS (this repo)
        uses: actions/checkout@v4
        with:
          path: HotSpotOS

      - name: Clone CustomPiOS
        run: git clone --depth 1 https://github.com/guysoft/CustomPiOS.git CustomPiOS

      - name: Patch CustomPiOS for Raspberry Pi OS Trixie (missing config files)
        run: |
          # The current Raspberry Pi OS Lite (Debian Trixie) image no longer ships
          # /etc/sysctl.conf or /etc/network/interfaces (it uses NetworkManager),
          # but auto-hotspot's start_chroot_script assumes both exist.
          F=CustomPiOS/src/modules/auto-hotspot/start_chroot_script
          sed -i "\%ip_forward=1/net.ipv4.ip_forward=1/g' /etc/sysctl.conf%i touch /etc/sysctl.conf" "$F"
          sed -i "\%cp /etc/network/interfaces /etc/network/interfaces-backup%i touch /etc/network/interfaces" "$F"
          grep -n -B1 -E 'sysctl.conf|interfaces-backup' "$F"

      - name: Disable IPv6 (GitHub runner IPv6 routes are often unreachable)
        run: |
          # apt-get inside the chroot shares the host network stack; when the
          # runner's IPv6 default route is black-holed, apt intermittently tries
          # an AAAA record first and fails with "Network is unreachable" instead
          # of falling back to IPv4. Disabling IPv6 forces IPv4-only fetches.
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # realpath ships in coreutils (already present on the runner).
          # qemu-user-static is a virtual package on newer Ubuntu releases;
          # qemu-user-binfmt registers binfmt_misc, qemu-user ships the
          # qemu-arm-static binary CustomPiOS copies into the chroot.
          # python3-git (GitPython) is required by CustomPiOS's execution_order.py.
          sudo apt-get install -y p7zip-full qemu-user qemu-user-binfmt binfmt-support jq fdisk python3-git

      - name: Ensure qemu-arm-static exists for CustomPiOS
        run: |
          # Newer qemu-user packages no longer ship a qemu-arm-static binary
          # (CustomPiOS's setup_qemu_static looks it up via `which qemu-arm-static`).
          # Symlink it to the real qemu-arm binary if it's missing.
          if ! command -v qemu-arm-static >/dev/null 2>&1; then
            sudo ln -sf "$(command -v qemu-arm)" /usr/bin/qemu-arm-static
          fi
          which qemu-arm-static
          qemu-arm-static --version

      - name: Download Raspberry Pi OS Lite base image
        run: |
          cd HotSpotOS/src/image
          wget -c --trust-server-names 'https://downloads.raspberrypi.org/raspios_lite_armhf_latest'

      - name: Point HotSpotOS at the CustomPiOS checkout
        run: |
          cd HotSpotOS/src
          ../../CustomPiOS/src/update-custompios-paths

      - name: Enable loop device support
        run: sudo modprobe loop

      - name: Build image
        run: |
          cd HotSpotOS/src
          sudo bash -x ./build_dist "${{ inputs.variant }}"

      - name: Checksum artifact
        if: success()
        run: |
          cd HotSpotOS/src/workspace
          sudo chown -R "$USER:$USER" .
          IMG="$(ls *.img | head -n1)"
          xz -T0 -k "$IMG"
          sha256sum "$IMG.xz" | tee "$IMG.xz.sha256"

      - name: Upload image artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HotSpotOS-image
          path: |
            HotSpotOS/src/workspace/*.img.xz
            HotSpotOS/src/workspace/*.img.xz.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HotSpotOS-build-log
          path: HotSpotOS/src/build.log
          if-no-files-found: ignore
